name: yt-fetch
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: YouTube playlist compact summary
        run: |
          python3 - << 'PYEOF'
          import json, re, urllib.request

          PLAYLIST = "PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7"
          KEY = "AIzaSyB7uygx81zztRt740fDOb_ZyfgyCCiyZNE"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "ignore")

          items = []
          token = None
          while True:
              u = "https://youtube.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails,status&playlistId=%s&maxResults=50&key=%s" % (PLAYLIST, KEY)
              if token:
                  u += "&pageToken=" + urllib.parse.quote(token)
              data = json.loads(get(u))
              items.extend(data.get("items", []))
              token = data.get("nextPageToken")
              if not token:
                  break

          print("TOTAL_ITEMS:", len(items))
          for it in items:
              s = it.get("snippet", {})
              pos = s.get("position")
              vid = s.get("resourceId", {}).get("videoId", "")
              title = s.get("title", "")
              desc = s.get("description", "") or ""
              urls = re.findall(r'https?://[^\s\)\]\>"\']+', desc)
              gh = []
              hf = []
              for x in urls:
                  x = x.rstrip(".,;")
                  if "github.com" in x.lower() and x not in gh:
                      gh.append(x)
                  if "huggingface.co" in x.lower() and x not in hf:
                      hf.append(x)
              print("ITEM\t%s\t%s\t%s" % (pos, vid, title))
              print("GH\t%s\t%s" % (pos, " | ".join(gh)))
              print("HF\t%s\t%s" % (pos, " | ".join(hf)))
              print("DESC\t%s\t%s" % (pos, re.sub(r"\s+", " ", desc)[:400]))
          PYEOF
